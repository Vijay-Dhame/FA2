apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: devops-fa2
  labels:
    app: grafana
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.devops-fa2.svc.cluster.local:9090
        isDefault: true
        editable: true
