# =============================================================================
# CI/CD Pipeline — DevOps Environment Manager (FA2)
# Triggered on push to main and pull requests to main.
# =============================================================================
name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/fa2

permissions:
  contents: read
  packages: write

# ---------------------------------------------------------------------------
# JOB 1: Test — Install deps, run backend unit tests, build frontend
# ---------------------------------------------------------------------------
jobs:
  test:
    name: "Build & Test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend unit tests
        run: |
          python -m pytest backend/tests/ -v --tb=short

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend (production)
        working-directory: frontend
        run: npm run build

  # ---------------------------------------------------------------------------
  # JOB 2: Docker Build & Push to GHCR
  # Only runs on push to main (not on PRs), and only after tests pass.
  # ---------------------------------------------------------------------------
  docker-publish:
    name: "Docker Build & Publish to GHCR"
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Git SHA (short)
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build backend Docker image
        run: |
          docker build -t ${{ env.IMAGE_PREFIX }}-backend:${{ steps.vars.outputs.sha_short }} -t ${{ env.IMAGE_PREFIX }}-backend:latest ./backend

      - name: Build frontend Docker image
        run: |
          docker build -t ${{ env.IMAGE_PREFIX }}-frontend:${{ steps.vars.outputs.sha_short }} -t ${{ env.IMAGE_PREFIX }}-frontend:latest ./frontend

      - name: Push backend image to GHCR
        run: |
          docker push ${{ env.IMAGE_PREFIX }}-backend:${{ steps.vars.outputs.sha_short }}
          docker push ${{ env.IMAGE_PREFIX }}-backend:latest

      - name: Push frontend image to GHCR
        run: |
          docker push ${{ env.IMAGE_PREFIX }}-frontend:${{ steps.vars.outputs.sha_short }}
          docker push ${{ env.IMAGE_PREFIX }}-frontend:latest

  # ---------------------------------------------------------------------------
  # JOB 3: Deploy to local Kubernetes (self-hosted runner)
  # Only runs after images are published successfully.
  # ---------------------------------------------------------------------------
  deploy:
    name: "Deploy to Kubernetes"
    runs-on: self-hosted
    needs: docker-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Verify Kubernetes connectivity
        run: kubectl cluster-info

      - name: Extract Git SHA (short)
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Create namespace (idempotent)
        run: kubectl apply -f k8s/namespace.yaml

      - name: Apply ConfigMap
        run: kubectl apply -f k8s/configmap.yaml

      - name: Update backend image tag in deployment
        run: |
          (Get-Content k8s/backend-deployment.yaml) -replace 'image: ghcr.io/vijay-dhame/fa2-backend:latest', "image: ${{ env.IMAGE_PREFIX }}-backend:${{ steps.vars.outputs.sha_short }}" | kubectl apply -f -
        shell: pwsh

      - name: Update frontend image tag in deployment
        run: |
          (Get-Content k8s/frontend-deployment.yaml) -replace 'image: ghcr.io/vijay-dhame/fa2-frontend:latest', "image: ${{ env.IMAGE_PREFIX }}-frontend:${{ steps.vars.outputs.sha_short }}" | kubectl apply -f -
        shell: pwsh

      - name: Apply Services
        run: |
          kubectl apply -f k8s/backend-service.yaml
          kubectl apply -f k8s/frontend-service.yaml

      - name: Deploy Monitoring Stack
        run: |
          kubectl apply -f k8s/monitoring/prometheus-config.yaml
          kubectl apply -f k8s/monitoring/prometheus-deployment.yaml
          kubectl apply -f k8s/monitoring/prometheus-service.yaml
          kubectl apply -f k8s/monitoring/grafana-provisioning/datasource.yaml
          kubectl apply -f k8s/monitoring/grafana-provisioning/dashboard-provider.yaml
          kubectl apply -f k8s/monitoring/grafana-dashboard-configmap.yaml
          kubectl apply -f k8s/monitoring/grafana-deployment.yaml
          kubectl apply -f k8s/monitoring/grafana-service.yaml

      - name: Wait for backend rollout
        run: kubectl rollout status deployment/backend -n devops-fa2 --timeout=120s

      - name: Wait for frontend rollout
        run: kubectl rollout status deployment/frontend -n devops-fa2 --timeout=120s

      - name: Wait for Prometheus rollout
        run: kubectl rollout status deployment/prometheus -n devops-fa2 --timeout=120s

      - name: Wait for Grafana rollout
        run: kubectl rollout status deployment/grafana -n devops-fa2 --timeout=120s

      - name: Show deployment status
        run: |
          kubectl get all -n devops-fa2
          echo "---"
          echo "Frontend:   http://localhost:30080"
          echo "Backend:    http://localhost:30080/health"
          echo "Prometheus: http://localhost:30090"
          echo "Grafana:    http://localhost:30030  (admin/admin)"
