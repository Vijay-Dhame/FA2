apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: devops-fa2
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      # Prometheus self-monitoring
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # DevOps Environment Manager backend
      - job_name: 'devops-backend'
        metrics_path: /metrics
        scrape_interval: 10s
        static_configs:
          - targets: ['backend.devops-fa2.svc.cluster.local:8000']
            labels:
              app: 'devops-environment-manager'
              component: 'backend'
