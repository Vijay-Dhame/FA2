apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: devops-fa2
  labels:
    app: frontend
    project: devops-environment-manager
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
      protocol: TCP
